# Cerebrus AI - RAG System Configuration
# Comprehensive YAML configuration for modular RAG system

system:
  name: "Cerebrus RAG System"
  version: "2.0.0"
  environment: "development"  # development | production

# Document Store Configuration
document_store:
  # Provider type: inmemory | elasticsearch | vectordb
  provider: "inmemory"
  
  inmemory:
    embedding_similarity_function: "cosine"
  
  elasticsearch:
    hosts:
      - "http://localhost:9200"
    index: "cerebrus_documents"
    timeout: 30
    verify_certs: false
    
  vectordb:
    provider: "qdrant"  # qdrant | chromadb | pinecone
    collection_name: "cerebrus_rag"
    embedding_dim: 384
    # Additional vectordb config loaded from vector_database module

# Retrieval Configuration
retrieval:
  provider: "inmemory_bm25"  # inmemory_bm25 | elasticsearch_bm25 | vectordb
  top_k: 20
  
  bm25:
    fuzziness: "AUTO"  # AUTO | 0 | 1 | 2
    
  vectordb:
    similarity_metric: "cosine"
    filter_strategy: "pre_filter"  # pre_filter | post_filter

# Ranking Configuration
ranking:
  enabled: true
  provider: "fastembed"  # fastembed | cohere | sentencetransformers
  top_k: 8
  
  fastembed:
    model_name: "Xenova/ms-marco-MiniLM-L-6-v2"
    batch_size: 32
    
  cohere:
    model: "rerank-english-v2.0"
    
  sentencetransformers:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# Generation Configuration
generation:
  provider: "gemini"  # gemini | openai | anthropic
  
  gemini:
    model: "gemini-2.0-flash"
    api_key_env: "GEMINI_API_KEY"
    fallback_models:
      - "gemini-1.5-pro-latest"
      - "gemini-1.5-flash-latest"
      - "gemini-pro"
    temperature: 0.7
    max_tokens: 2048
    top_p: 0.95
    
  openai:
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.7
    max_tokens: 2048
    
  anthropic:
    model: "claude-3-5-sonnet-20241022"
    api_key_env: "ANTHROPIC_API_KEY"
    temperature: 0.7
    max_tokens: 2048

# Context Building Configuration
context:
  max_documents: 8
  include_metadata: true
  metadata_fields:
    - source_file
    - page_number
    - source_type
    - timestamp
  format: "numbered"  # numbered | markdown | plain
  max_context_length: 4000
  truncation_strategy: "middle"  # start | middle | end

# Citation Configuration
citation:
  enabled: true
  style: "numeric"  # numeric | author_year | footnote
  include_scores: true
  score_threshold: 0.0
  preview_length: 200

# Prompt Configuration
prompts:
  system_prompt_file: "config/prompts/default_system_prompt.txt"
  custom_prompts_file: "config/prompts/custom_prompts.yml"
  template_engine: "jinja2"

# Performance Configuration
performance:
  warm_up_on_init: true
  cache_embeddings: true
  batch_processing: true
  max_concurrent_requests: 10
  request_timeout: 60

# Logging Configuration
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "structured"
  include_timestamps: true
  log_performance_metrics: true
  log_sources: true
